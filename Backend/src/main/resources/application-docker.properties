# ── Datasource (MySQL — runs inside the Docker Compose network) ──
spring.datasource.url=${MYSQL_URL:jdbc:mysql://mysql:3306/financialaccounting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:fauser}
spring.datasource.password=${MYSQL_PASSWORD:fapassword}

# ── Schema initialization ───────────────────────────────────────
# Use the MySQL DDL (AUTO_INCREMENT, no SQLite AUTOINCREMENT or reserved
# TIMESTAMP column). Every table is CREATE TABLE IF NOT EXISTS with inline
# indexes, so it's fine to run on every boot.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-mysql.sql

# ── Cache / Redis ───────────────────────────────────────────────
# Nothing uses @Cacheable in the codebase, so this stack doesn't need Redis.
management.health.redis.enabled=false

# ── CORS ────────────────────────────────────────────────────────
# Frontend hits the backend same-origin through the nginx /api proxy, but we
# still allow the published frontend origin for direct access and Swagger testing.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600
