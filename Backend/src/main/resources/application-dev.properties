# ── Datasource (SQLite) ─────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:sqlite/FA.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ── Foreign key enforcement ─────────────────────────────────────
# SQLite turns foreign keys off per-connection by default, so the FK
# constraints in schema.sql wouldn't actually be enforced at runtime.
# HikariCP runs this on every physical connection it opens, so every
# connection in the pool enforces them. ForeignKeyEnforcementValidator
# double-checks this at startup.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# ── Schema initialization ───────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# ── CORS ────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600
