services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: financialaccounting
      MYSQL_USER: fauser
      MYSQL_PASSWORD: fapassword
      MYSQL_ROOT_PASSWORD: rootpassword
    # Host port 3307 -> container 3306 to avoid clashing with a MySQL already
    # running on the host's default 3306. The backend connects over the Compose
    # network (mysql:3306), so this mapping only affects host-side access.
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./Backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_URL: jdbc:mysql://mysql:3306/financialaccounting?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MYSQL_USER: fauser
      MYSQL_PASSWORD: fapassword
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend/web-app
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
